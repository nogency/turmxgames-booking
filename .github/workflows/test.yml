name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx jest --ci
      # Auftragsbestätigungen aus tests/pdf.test.js zum Ansehen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-preview
          path: pdf-preview/
          if-no-files-found: ignore
