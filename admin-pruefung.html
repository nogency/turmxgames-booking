<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zahlungsprüfung – TurmX Admin</title>
<style>
  :root{--bg:#f3f3f1;--surface:#fff;--ink:#18181b;--ink-2:#55555c;--line:#e3e1dc;--ok:#1d7a45;--bad:#b3261e;--warn:#8a5a00;--accent:#c0392b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:24px;margin:0 0 4px}
  p.lead{color:var(--ink-2);margin:0 0 18px;max-width:70ch}
  form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  input{flex:1 1 240px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}
  button{padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .card b{display:block;font-size:13px;color:var(--ink-2);font-weight:600}
  .card span{font-size:14px}
  .tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;min-width:980px;font-size:13.5px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.5px}
  td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .r{font-weight:600;white-space:nowrap}
  .r.ok{color:var(--ok)}.r.abweichung,.r.keine-zahlung{color:var(--bad)}.r.ohne-bestellung,.r.fehler,.r.zeitlimit{color:var(--warn)}
  .msg{color:var(--bad);margin:8px 0}
  small{color:var(--ink-2)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Zahlungsprüfung</h1>
  <p class="lead">Stufe 1, nur beobachten: Der Server rechnet bei jeder Zahlung und Buchung den Preis selbst nach und vergleicht. Hier wird nichts blockiert. „ohne-bestellung" heißt: Anfrage von der alten Seite /v1.html.</p>
  <form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="Admin-Passwort" aria-label="Admin-Passwort"><button type="submit">Bericht laden</button></form>
  <div id="out"></div>
</div>
<script>
  const eur = c => c == null ? '–' : (c / 100).toFixed(2).replace('.', ',') + ' €';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const out = document.getElementById('out');
    out.innerHTML = '<p><small>Lädt …</small></p>';
    try {
      const r = await fetch('/api/bookla?action=paycheck-report', { headers: { Authorization: 'Bearer ' + document.getElementById('pw').value.trim() } });
      if (r.status === 401) { out.innerHTML = '<p class="msg">Passwort stimmt nicht.</p>'; return; }
      const d = await r.json();
      const groups = {};
      Object.entries(d.stats || {}).forEach(([k, n]) => { const [stage, result] = k.split(':'); (groups[stage] = groups[stage] || []).push(`${result}: ${n}`); });
      const cards = Object.entries(groups).map(([stage, list]) => `<div class="card"><b>${esc(stage)}</b><span>${list.map(esc).join('<br>')}</span></div>`).join('') || '<p><small>Noch keine Einträge.</small></p>';
      const rows = (d.entries || []).map(x => `<tr>
        <td class="num">${esc(new Date(x.ts).toLocaleString('de-DE'))}</td>
        <td>${esc(x.stage)}</td><td class="r ${esc(x.result)}">${esc(x.result)}</td>
        <td>${esc(x.method || '')}</td>
        <td class="num">${eur(x.expectedCents)}</td><td class="num">${eur(x.actualCents)}</td>
        <td>${esc((x.issues || []).concat(x.notes || []).join(' · '))}</td>
        <td>${x.order ? esc(`${x.order.event} ${x.order.date} ${x.order.time} · ${x.order.qty} P. · ${x.order.extras}${x.order.promo ? ' · ' + x.order.promo : ''}${x.order.link ? ' · Link ' + x.order.link : ''}`) : ''}</td>
        <td><small>${esc(x.bookingId || '')}<br>${esc(x.ref || '')}</small></td></tr>`).join('');
      out.innerHTML = `<div class="cards">${cards}</div>
        <div class="tw"><table><thead><tr><th>Zeit</th><th>Stelle</th><th>Ergebnis</th><th>Weg</th><th>Erwartet</th><th>Tatsächlich</th><th>Hinweis</th><th>Bestellung</th><th>Buchung / Zahlung</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="9"><small>Noch keine Einträge.</small></td></tr>'}</tbody></table></div>`;
    } catch (err) { out.innerHTML = '<p class="msg">Bericht konnte nicht geladen werden.</p>'; }
  });
</script>
</body>
</html>
